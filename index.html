<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#090a0f; z-index:10000; padding:20px; box-sizing:border-box; overflow-y:auto;">
    <div style="text-align:right;"><button onclick="closeModal()" style="background:none; border:none; color:white; font-size:30px;">&times;</button></div>
    <h2 id="modal-title" style="color:var(--accent);"></h2>
    <hr style="border:0.5px solid rgba(255,255,255,0.1);">
    <div id="modal-body" style="line-height:1.6; text-align:left; padding-top:20px;">
        <p id="ai-placeholder">Звезды выстраиваются в ряд... ИИ анализирует вашу карту...</p>
    </div>
</div>

<script>
function openModule(type) {
    const modal = document.getElementById('modal');
    const title = document.getElementById('modal-title');
    modal.style.display = 'block';
    
    if(type === 'natal') title.innerText = '🪐 Натальная карта';
    if(type === 'hd') title.innerText = '🧬 Human Design';
    if(type === 'finance') title.innerText = '💎 Финансовый портрет';
    if(type === 'horo') title.innerText = '🔮 Прогноз на сегодня';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}
</script>
