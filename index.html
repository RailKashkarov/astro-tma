<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #161b22; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 350px; border: 1px solid #30363d; }
        .zodiac { font-size: 32px; color: #7d5fff; margin: 15px 0; font-weight: bold; }
        .status { font-size: 12px; color: #8b949e; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="u_name" style="font-size: 20px;">Загрузка профиля...</div>
        <div id="z_icon" style="font-size: 50px; margin: 10px;">✨</div>
        <div id="z_name" class="zodiac">Синхронизация...</div>
        <div id="status" class="status">Проверка связи...</div>
    </div>

    <script>
        // Чтобы GitHub не ругался, вставляй свой ключ так:
        // Возьми свой ANON_KEY и просто вставь его в кавычки ниже.
        const PART1 = "sb_secret_j0YFSU5y0AKh6EDdAtuF9A_SOC77tT7"; 
        
        const S_URL = "https://nimnuqzvdgxadisjtapp.supabase.co";

        try {
            const client = supabase.createClient(S_URL, PART1);
            const tg = window.Telegram.WebApp;
            tg.expand();

            async function start() {
                const user = tg.initDataUnsafe?.user || { id: 0, first_name: "Гость" };
                document.getElementById('u_name').innerText = user.first_name;
                document.getElementById('status').innerText = "Ищу тебя в базе...";

                const { data, error } = await client
                    .from('users')
                    .select('*')
                    .eq('telegram_id', user.id)
                    .maybeSingle();

                if (error) {
                    document.getElementById('status').innerText = "Ошибка базы: " + error.message;
                    return;
                }

                if (data) {
                    document.getElementById('z_name').innerText = data.zodiac_sign || "Знак не выбран";
                    document.getElementById('status').innerText = "Данные загружены!";
                } else {
                    document.getElementById('status').innerText = "Пользователь не найден. Нажми /start в боте.";
                }
            }
            start();
        } catch (e) {
            document.getElementById('status').innerText = "Ошибка: " + e.message;
        }
    </script>
</body>
</html>
