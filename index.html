<script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const URL = "https://nimnuqzvdgxadisjtapp.supabase.co";
        const KEY = "sb_secret_j0YFSU5y0AKh6EDdAtuF9A_SOC77tT7"; // Проверь кавычки!

        async function load() {
            const st = document.getElementById('status');
            try {
                // Проверка инициализации клиента
                const client = supabase.createClient(URL, KEY);
                st.innerText = "Клиент создан. Ищу пользователя...";

                const user = tg.initDataUnsafe?.user || { id: 12345, first_name: "Тестовый вход" };
                document.getElementById('u_name').innerText = user.first_name;

                const { data, error } = await client
                    .from('users')
                    .select('*')
                    .eq('telegram_id', user.id)
                    .maybeSingle();

                if (error) {
                    st.innerText = "Ошибка базы: " + error.message;
                    return;
                }

                if (data) {
                    document.getElementById('z_name').innerText = data.zodiac_sign || "Знак не найден";
                    st.innerText = "Готово!";
                } else {
                    st.innerText = "Пользователь не найден в базе. Нажми /start в боте!";
                }
            } catch (e) {
                // Если код упал, мы увидим причину здесь
                st.innerText = "Критическая ошибка: " + e.message;
                console.error(e);
            }
        }
        load();
    </script>
