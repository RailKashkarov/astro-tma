<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astro TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.1); --accent: #8a2be2; }
        body { margin: 0; background: #090a0f; color: white; font-family: sans-serif; text-align: center; }
        
        #loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999; 
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #app-content { display: none; padding: 20px; }
        .card { background: var(--glass); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background: var(--glass); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        
        /* Лог для отладки */
        #debug-log { font-size: 10px; color: #ff4444; margin-top: 20px; text-align: left; padding: 10px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>Синхронизация...</p>
        <div id="debug-log"></div>
    </div>

    <div id="app-content">
        <h1>ASTRO SYSTEM</h1>
        <div class="card">
            <h2 id="user-name">Загрузка...</h2>
            <p id="user-info">...</p>
        </div>
        <div class="grid">
            <div class="btn" onclick="tg.showAlert('В разработке')">🪐 Натал</div>
            <div class="btn" onclick="tg.showAlert('В разработке')">🧬 Дизайн</div>
            <div class="btn" onclick="tg.showAlert('В разработке')">💎 Финансы</div>
            <div class="btn" onclick="tg.showAlert('В разработке')">🔮 Прогноз</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
