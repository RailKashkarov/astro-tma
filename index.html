<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astro System</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --accent: #a29bfe; --bg: #0a0b10; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow-x: hidden; }
        
        #loader { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .spinner { width: 30px; height: 30px; border: 2px solid #222; border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }

        .container { padding: 20px; opacity: 0; transition: 0.8s; display: none; }
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 30px 20px; margin: 20px 0; backdrop-filter: blur(15px); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { background: var(--glass); padding: 25px 15px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.05); font-size: 14px; transition: 0.3s; cursor: pointer; }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.15); }

        /* Модальное окно */
        #modal { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { font-size: 28px; color: var(--accent); cursor: pointer; padding: 10px; }
        .ai-content { line-height: 1.6; font-size: 16px; color: #ececec; text-align: left; white-space: pre-wrap; }
        
            </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div id="app" class="container">
        <h2 style="font-weight: 200; letter-spacing: 5px; margin-top: 40px;">ASTRO SYSTEM</h2>
        
        <div class="card">
            <div id="u-name" style="font-size: 24px; font-weight: bold; letter-spacing: 1px;">Странник</div>
            <div id="u-info" style="font-size: 13px; opacity: 0.5; margin-top: 10px; letter-spacing: 1px;">Синхронизация...</div>
        </div>

        <div class="grid">
            <div class="btn" onclick="openModule('natal')">🪐 Натал</div>
            <div class="btn" onclick="openModule('hd')">🧬 Дизайн</div>
            <div class="btn" onclick="openModule('finance')">💎 Финансы</div>
            <div class="btn" onclick="openModule('horo')">🔮 Прогноз</div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-header">
            <span id="modal-title" style="font-size: 18px; letter-spacing: 2px; color: var(--accent);">РАЗБОР</span>
            <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
        <div id="modal-body" class="ai-content"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const S_URL = "https://nimnuqzvdgxadisjtapp.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pbW51cXp2ZGd4YWRpc2p0YXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwMTMyMjcsImV4cCI6MjA4NzU4OTIyN30.3iHv_nhBdPZB_sT4TSDSynsu9jEHVDjihV3bLvehcJQ";
        let userData = null;

        async function init() {
            tg.ready();
            tg.expand();
            try {
                const sb = supabase.createClient(S_URL, S_KEY);
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    const { data } = await sb.from('users').select('*').eq('telegram_id', user.id).single();
                    if (data) {
                        userData = data;
                        document.getElementById('u-name').innerText = data.username || user.first_name;
                        document.getElementById('u-info').innerText = `${data.birth_date} • ${data.birth_city}`;
                    }
                }
            } catch (e) { console.error(e); }
            
            document.getElementById('loader').style.display = 'none';
            const app = document.getElementById('app');
            app.style.display = 'block';
            setTimeout(() => app.style.opacity = '1', 50);
        }

        function openModule(type) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            modal.style.display = 'flex';
            body.innerHTML = "Звезды выстраиваются в ряд... Анализирую ваши данные...";

            // Имитация загрузки от ИИ
            setTimeout(() => {
                if (type === 'natal') {
                    title.innerText = "НАТАЛЬНАЯ КАРТА";
                    // Берем данные из JSON колонки, которую сохранил бот
                    const info = userData?.astrology_data;
                    body.innerHTML = info ? 
                        `Ваше Солнце в знаке ${info.sun || '...'}. \n\nЭто дает вам невероятную энергию в сфере ${info.house || '...'}. ИИ рекомендует сфокусироваться на внутреннем росте.` :
                        "Данные для натальной карты еще не рассчитаны. Пожалуйста, обновите профиль в боте.";
                }
                if (type === 'hd') {
                    title.innerText = "HUMAN DESIGN";
                    body.innerHTML = `Ваш тип: ${userData?.hd_type || 'Генератор'}. \n\nВаша стратегия: Откликаться на возможности мира. Не инициируйте из ума, ждите внутреннего отклика.`;
                }
            }, 1000);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
