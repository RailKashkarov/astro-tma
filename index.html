<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astro System Premium All-In-One</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --accent: #a29bfe; --bg: #0a0b10; --card-bg: #161b22; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        
        #loader { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 35px; height: 35px; border: 3px solid #222; border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; display: none; }
        .card { background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        
        .settings-btn { position: absolute; top: 22px; right: 22px; font-size: 22px; cursor: pointer; opacity: 0.6; transition: 0.3s; }
        .settings-btn:hover { opacity: 1; transform: rotate(45deg); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { background: var(--glass); padding: 22px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; cursor: pointer; font-size: 14px; line-height: 1.4; }
        .btn-advice { grid-column: span 2; background: rgba(162, 155, 254, 0.12); border: 1px dashed var(--accent); color: var(--accent); font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        .btn-full { grid-column: span 2; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: black; font-weight: bold; border: none; margin-top: 5px; }

        #modal { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: none; flex-direction: column; }
        .modal-content { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
        .modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
        
        .ai-section { background: rgba(255, 255, 255, 0.03); border-left: 3px solid var(--accent); padding: 18px; margin-top: 20px; line-height: 1.6; white-space: pre-wrap; border-radius: 0 12px 12px 0; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table td { padding: 14px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .data-table td:last-child { text-align: right; color: var(--accent); font-weight: bold; }

        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #222; }
        .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }

        .tabs { display: flex; gap: 10px; margin: 15px 0; overflow-x: auto; padding-bottom: 8px; }
        .tab { padding: 10px 18px; background: var(--glass); border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .tab.active { background: var(--accent); color: black; font-weight: bold; }

        input { width: 100%; padding: 16px; margin: 8px 0 16px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 14px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--accent); }
        label { font-size: 12px; opacity: 0.8; margin-left: 5px; color: var(--accent); font-weight: bold; text-transform: uppercase; }
        
        .hd-chart { width: 100%; height: 220px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div id="app" class="container">
        <div class="card">
            <div class="settings-btn" onclick="openModule('settings')">⚙️</div>
            <div id="u-name" style="font-size: 24px; font-weight: bold;">Странник</div>
            <div id="u-info" style="opacity: 0.5; font-size: 14px; margin-top: 6px;">Синхронизация...</div>
        </div>

        <div class="grid">
            <div class="btn btn-advice" onclick="openModule('advice')">✨ Получить совет дня</div>
            <div class="btn" onclick="openModule('natal')">🪐<br>Натальная карта</div>
            <div class="btn" onclick="openModule('hd')">🧬<br>Дизайн человека</div>
            <div class="btn" onclick="openModule('finance')">💎<br>Финансовый портрет</div>
            <div class="btn" onclick="openModule('horo')">🔮<br>Прогноз на день</div>
            <div class="btn btn-full" onclick="openModule('love')">❤️ Совместимость партнеров</div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-header">
            <b id="m-title" style="letter-spacing: 1px;">РАЗБОР</b>
            <span onclick="closeModal()" style="font-size: 30px; cursor: pointer;">&times;</span>
        </div>
        <div id="m-content" class="modal-content"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const S_URL = "https://nimnuqzvdgxadisjtapp.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pbW51cXp2ZGd4YWRpc2p0YXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwMTMyMjcsImV4cCI6MjA4NzU4OTIyN30.3iHv_nhBdPZB_sT4TSDSynsu9jEHVDjihV3bLvehcJQ";
        let myData = null;
        let sb = null;

        async function init() {
            try {
                sb = supabase.createClient(S_URL, S_KEY);
                const user = tg.initDataUnsafe?.user;
                if(!user) {
                    document.getElementById('u-info').innerText = "Откройте в Telegram";
                    return;
                }

                // Пытаемся получить данные
                let { data, error } = await sb.from('users').select('*').eq('telegram_id', user.id).single();
                
                // РЕГИСТРАЦИЯ НОВОГО ПОЛЬЗОВАТЕЛЯ
                if(!data) {
                    const newUser = {
                        telegram_id: user.id,
                        username: user.username || user.first_name || "Странник",
                        notify_lunar: false, 
                        notify_biorhythm: false, 
                        notify_money: false, 
                        notify_advice: false
                    };
                    const { data: created, error: insertError } = await sb.from('users').insert([newUser]).select().single();
                    if (insertError) {
                        console.error("Insert error:", insertError);
                        tg.showAlert("Ошибка регистрации: " + insertError.message);
                    } else {
                        data = created;
                    }
                }

                if(data) { 
                    myData = data; 
                    document.getElementById('u-name').innerText = myData.username;
                    document.getElementById('u-info').innerText = myData.birth_date ? `${myData.birth_date} • ${myData.birth_city}` : "Данные не заполнены в боте";
                }
            } catch(e) { 
                console.error("General init error:", e); 
                tg.showAlert("Ошибка приложения: " + e.message);
            }
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        async function updateNotify(field, value) {
            if(!myData) return;
            const { error } = await sb.from('users').update({ [field]: value }).eq('telegram_id', myData.telegram_id);
            if (error) {
                console.error("Update error:", error);
                tg.showAlert("Ошибка сохранения: " + error.message);
                // Откатываем визуально чекбокс, если ошибка
                setTimeout(() => { openModule('settings'); }, 500);
            } else {
                myData[field] = value;
            }
        }

        function getDailyText(key, func) {
            const day = new Date().toISOString().split('T')[0];
            const k = `${key}_${day}`;
            if(localStorage.getItem(k)) return localStorage.getItem(k);
            const txt = func();
            localStorage.setItem(k, txt);
            return txt;
        }

        function openModule(type) {
            const m = document.getElementById('modal');
            const cont = document.getElementById('m-content');
            const title = document.getElementById('m-title');
            m.style.display = 'flex';
            cont.innerHTML = '';

            if(type === 'settings') {
                title.innerText = 'УВЕДОМЛЕНИЯ';
                cont.innerHTML = `
                    <div class="setting-item"><span>🌙 Лунный календарь</span><label class="switch"><input type="checkbox" ${myData?.notify_lunar ? 'checked' : ''} onchange="updateNotify('notify_lunar', this.checked)"><span class="slider"></span></label></div>
                    <div class="setting-item"><span>🧬 Биоритмы</span><label class="switch"><input type="checkbox" ${myData?.notify_biorhythm ? 'checked' : ''} onchange="updateNotify('notify_biorhythm', this.checked)"><span class="slider"></span></label></div>
                    <div class="setting-item"><span>💎 Деньги</span><label class="switch"><input type="checkbox" ${myData?.notify_money ? 'checked' : ''} onchange="updateNotify('notify_money', this.checked)"><span class="slider"></span></label></div>
                    <div class="setting-item"><span>✨ Совет дня</span><label class="switch"><input type="checkbox" ${myData?.notify_advice ? 'checked' : ''} onchange="updateNotify('notify_advice', this.checked)"><span class="slider"></span></label></div>
                `;
            }

            else if(type === 'natal') {
                title.innerText = 'НАТАЛЬНАЯ КАРТА';
                const a = myData?.astrology_data || {};
                cont.innerHTML = `
                    <h3>Планеты в знаках</h3>
                    <table class="data-table">
                        <tr><td>Солнце</td><td>${a.sun || 'Не определено'}</td></tr>
                        <tr><td>Луна</td><td>${a.moon || 'Не определено'}</td></tr>
                        <tr><td>Меркурий</td><td>${a.mercury || 'Не определено'}</td></tr>
                        <tr><td>Венера</td><td>${a.venus || 'Не определено'}</td></tr>
                        <tr><td>Марс</td><td>${a.mars || 'Не определено'}</td></tr>
                        <tr><td>Юпитер</td><td>${a.jupiter || 'Не определено'}</td></tr>
                        <tr><td>Сатурн</td><td>${a.saturn || 'Не определено'}</td></tr>
                    </table>
                `;
            }

            else if(type === 'hd') {
                title.innerText = 'ДИЗАЙН ЧЕЛОВЕКА';
                cont.innerHTML = `
                    <div class="hd-chart"><span style="opacity:0.3">БОДИГРАФ</span></div>
                    <table class="data-table">
                        <tr><td>Тип</td><td>${myData?.hd_type || 'Генератор'}</td></tr>
                        <tr><td>Профиль</td><td>4/6 (Оппортунист)</td></tr>
                        <tr><td>Авторитет</td><td>Сакральный</td></tr>
                        <tr><td>Стратегия</td><td>Ждать отклика</td></tr>
                        <tr><td>Ложное Я</td><td>Фрустрация</td></tr>
                        <tr><td>Крест</td><td>Правления</td></tr>
                    </table>
                `;
            }

            else if(type === 'finance') {
                title.innerText = 'ФИНАНСЫ';
                cont.innerHTML = `
                    <table class="data-table">
                        <tr><td>2-й дом (Деньги)</td><td>Телец</td></tr>
                        <tr><td>Управитель 2-го</td><td>Венера</td></tr>
                        <tr><td>8-й дом (Чужие деньги)</td><td>Скорпион</td></tr>
                        <tr><td>Управитель 8-го</td><td>Плутон</td></tr>
                        <tr><td>Юпитер</td><td>2-й дом</td></tr>
                        <tr><td>Сатурн</td><td>10-й дом</td></tr>
                    </table>
                `;
            }

            else if(type === 'horo') {
                title.innerText = 'ГОРОСКОП';
                cont.innerHTML = `
                    <div class="tabs"><div class="tab active">Сегодня</div><div class="tab">Завтра</div><div class="tab">Неделя</div><div class="tab">Полгода</div></div>
                    <div class="ai-section">${getDailyText('horo', () => "Сегодня удачный день для планирования.")}</div>
                `;
            }

            else if(type === 'love') {
                title.innerText = 'СОВМЕСТИМОСТЬ';
                cont.innerHTML = `
                    <label>Имя партнера</label><input type="text" id="p-name">
                    <label>Дата рождения</label><input type="date" id="p-date">
                    <label>Время</label><input type="time" id="p-time">
                    <label>Город</label><input type="text" id="p-city">
                    <button class="btn btn-full" onclick="calcLove()">Рассчитать союз</button>
                    <div id="l-res" style="display:none;" class="ai-section"></div>
                `;
            }

            else if(type === 'advice') {
                title.innerText = 'СОВЕТ ДНЯ';
                cont.innerHTML = `<div class="ai-section">${getDailyText('adv', () => "Доверяйте внутреннему голосу.")}</div>`;
            }
        }

        function calcLove() {
            const n = document.getElementById('p-name').value;
            if(!n) return;
            const r = document.getElementById('l-res');
            r.style.display = 'block'; r.innerHTML = "Анализ...";
            setTimeout(() => { r.innerHTML = `<b>Совместимость с ${n}: 88%</b><br>Ваши души резонируют на одной частоте.`; }, 1000);
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        init();
    </script>
</body>
</html>
