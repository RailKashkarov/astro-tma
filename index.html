<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        .zodiac-name { font-size: 28px; font-weight: bold; margin: 10px 0; color: #7d5fff; }
        .status { font-size: 12px; color: #888; margin-top: 15px; }
        button {
            background: linear-gradient(45deg, #6a11cb 0%, #2575fc 100%);
            border: none; padding: 12px 20px; color: white;
            border-radius: 12px; font-weight: bold; margin-top: 20px; width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="user-name">Загрузка...</div>
        <div id="zodiac-icon" style="font-size: 70px; margin: 15px 0;">✨</div>
        <div id="zodiac-name" class="zodiac-name">Анализируем...</div>
        <div id="birth-date" style="color: #aaa; font-size: 14px;"></div>
        <button onclick="window.Telegram.WebApp.close()">Закрыть</button>
        <div class="status" id="status-text">Инициализация...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- ВСТАВЬ ДАННЫЕ СТРОГО ВНУТРИ КАВЫЧЕК ---
        const MY_URL = "https://nimnuqzvdgxadisjtapp.supabase.co"; 
        const MY_KEY = "sb_secret_j0YFSU5y0AKh6EDdAtuF9A_SOC77tT7"; 
        // ------------------------------------------

        // Инициализируем клиент с другим именем переменной, чтобы не было конфликта
        const mySupabase = supabase.createClient(MY_URL, MY_KEY);

        async function startApp() {
            const status = document.getElementById('status-text');
            const user = tg.initDataUnsafe?.user;

            if (!user) {
                status.innerText = "Ошибка: Откройте в Telegram";
                return;
            }

            document.getElementById('user-name').innerText = `Привет, ${user.first_name}!`;
            status.innerText = "Связываюсь с базой...";

            try {
                const { data, error } = await mySupabase
                    .from('users')
                    .select('*')
                    .eq('telegram_id', user.id)
                    .maybeSingle();

                if (error) throw error;

                if (data) {
                    document.getElementById('zodiac-name').innerText = data.zodiac_sign || "Знак не найден";
                    document.getElementById('birth-date').innerText = data.birth_date ? `Дата: ${data.birth_date}` : "Дата не указана";
                    status.innerText = "Данные получены";
                } else {
                    status.innerText = "Пользователь не найден. Сначала нажми /start в боте!";
                    document.getElementById('zodiac-name').innerText = "Пусто";
                }
            } catch (err) {
                console.error(err);
                status.innerText = "Ошибка API: " + err.message;
            }
        }

        startApp();
    </script>
</body>
</html>
