<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Astro System Full</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --accent: #a29bfe; --bg: #0a0b10; --card-bg: #161b22; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow-x: hidden; }
        
        #loader { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 35px; height: 35px; border: 3px solid #222; border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; }
        @keyframes s { to { transform: rotate(360deg); } }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; display: none; }
        .card { background: var(--card-bg); border-radius: 24px; padding: 25px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { background: var(--glass); padding: 22px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); text-align: center; cursor: pointer; font-size: 14px; line-height: 1.4; }
        .btn-advice { grid-column: span 2; background: rgba(162, 155, 254, 0.1); border: 1px dashed var(--accent); color: var(--accent); font-weight: bold; margin-bottom: 10px; }
        .btn-full { grid-column: span 2; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: black; font-weight: bold; border: none; margin-top: 5px; }

        #modal { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: none; flex-direction: column; }
        .modal-content { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
        .modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #222; }
        
        .ai-section { background: rgba(255, 255, 255, 0.03); border-left: 3px solid var(--accent); padding: 15px; margin-top: 20px; line-height: 1.6; white-space: pre-wrap; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .data-table td { padding: 12px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .data-table td:last-child { text-align: right; color: var(--accent); font-weight: bold; }

        .tabs { display: flex; gap: 10px; margin: 15px 0; overflow-x: auto; }
        .tab { padding: 10px 18px; background: var(--glass); border-radius: 20px; font-size: 12px; white-space: nowrap; }
        .tab.active { background: var(--accent); color: black; }

        input { width: 100%; padding: 15px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 12px; box-sizing: border-box; }
        label { font-size: 12px; opacity: 0.5; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div id="app" class="container">
        <div class="card">
            <div id="u-name" style="font-size: 24px; font-weight: bold;">Странник</div>
            <div id="u-info" style="opacity: 0.5; font-size: 14px; margin-top: 5px;">Синхронизация данных</div>
        </div>

        <div class="grid">
            <div class="btn btn-advice" onclick="openModule('advice')">✨ Получить совет дня</div>

            <div class="btn" onclick="openModule('natal')">🪐<br>Натальная карта</div>
            <div class="btn" onclick="openModule('hd')">🧬<br>Дизайн человека</div>
            <div class="btn" onclick="openModule('finance')">💎<br>Финансовый портрет</div>
            <div class="btn" onclick="openModule('horo')">🔮<br>Гороскоп на день</div>
            <div class="btn btn-full" onclick="openModule('love')">❤️ Совместимость партнеров</div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-header">
            <b id="m-title" style="letter-spacing: 1px;">РАЗБОР</b>
            <span onclick="closeModal()" style="font-size: 30px; cursor: pointer;">&times;</span>
        </div>
        <div id="m-content" class="modal-content"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const S_URL = "https://nimnuqzvdgxadisjtapp.supabase.co";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pbW51cXp2ZGd4YWRpc2p0YXBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIwMTMyMjcsImV4cCI6MjA4NzU4OTIyN30.3iHv_nhBdPZB_sT4TSDSynsu9jEHVDjihV3bLvehcJQ";
        let myData = null;

        async function init() {
            try {
                const sb = supabase.createClient(S_URL, S_KEY);
                const user = tg.initDataUnsafe?.user;
                if(user) {
                    const { data } = await sb.from('users').select('*').eq('telegram_id', user.id).single();
                    if(data) { myData = data; }
                    document.getElementById('u-name').innerText = data?.username || user.first_name;
                    document.getElementById('u-info').innerText = data ? `${data.birth_date} • ${data.birth_city}` : "Профиль не найден";
                }
            } catch(e) { console.error(e); }
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        function getDailyText(key, generatorFunc) {
            const today = new Date().toISOString().split('T')[0];
            const storageKey = `${key}_${today}`;
            const saved = localStorage.getItem(storageKey);
            if (saved) return saved;
            const newText = generatorFunc();
            localStorage.setItem(storageKey, newText);
            return newText;
        }

        function openModule(type) {
            const m = document.getElementById('modal');
            const cont = document.getElementById('m-content');
            const title = document.getElementById('m-title');
            m.style.display = 'flex';
            cont.innerHTML = '';

            if(type === 'advice') {
                title.innerText = 'СОВЕТ ДНЯ';
                const text = getDailyText('advice', () => "Сегодня ваш день наполнен энергией созидания. Сфокусируйтесь на завершении старых дел. ИИ рекомендует уделить 15 минут тишине.");
                cont.innerHTML = `<div class="ai-section"><b>Ваш персональный совет:</b>\n\n${text}</div>`;
            }

            else if(type === 'natal') {
                title.innerText = 'НАТАЛЬНАЯ КАРТА';
                const astro = myData?.astrology_data || {};
                cont.innerHTML = `
                    <h3>Положения планет</h3>
                    <table class="data-table">
                        <tr><td>Солнце</td><td>${astro.sun || 'Лев'}</td></tr>
                        <tr><td>Луна</td><td>${astro.moon || 'Скорпион'}</td></tr>
                        <tr><td>Меркурий</td><td>${astro.mercury || 'Дева'}</td></tr>
                    </table>
                    <div class="ai-section"><b>Разбор от ИИ:</b>\nВаша натальная карта говорит о сильном потенциале в самореализации...</div>
                `;
            }

            else if(type === 'hd') {
                title.innerText = 'ДИЗАЙН ЧЕЛОВЕКА';
                cont.innerHTML = `
                    <div style="width:100%; height:150px; background:var(--glass); border-radius:15px; display:flex; align-items:center; justify-content:center;">[SVG Бодиграф]</div>
                    <table class="data-table">
                        <tr><td>Тип</td><td>${myData?.hd_type || 'Генератор'}</td></tr>
                        <tr><td>Авторитет</td><td>Сакральный</td></tr>
                    </table>
                    <div class="ai-section"><b>Ваша стратегия:</b>\nДоверяйте внутреннему отклику, а не логическим доводам ума...</div>
                `;
            }

            else if(type === 'finance') {
                title.innerText = 'ФИНАНСОВЫЙ ПОРТРЕТ';
                cont.innerHTML = `
                    <h3>Ключи изобилия</h3>
                    <table class="data-table">
                        <tr><td>Денежный дом</td><td>2-й дом</td></tr>
                        <tr><td>Сфера успеха</td><td>Технологии</td></tr>
                    </table>
                    <div class="ai-section">ИИ: Ваш финансовый код активируется через партнерство и инновации...</div>
                `;
            }

            else if(type === 'horo') {
                title.innerText = 'ГОРОСКОП';
                const text = getDailyText('horo', () => "Юпитер входит в ваш сектор удачи. Благоприятный день для финансовых вложений и крупных покупок.");
                cont.innerHTML = `
                    <div class="tabs"><div class="tab active">Сегодня</div><div class="tab">Завтра</div><div class="tab">Неделя</div></div>
                    <div class="ai-section">${text}</div>
                `;
            }

            else if(type === 'love') {
                title.innerText = 'СОВМЕСТИМОСТЬ';
                cont.innerHTML = `
                    <div id="love-form" class="card">
                        <label>Имя партнера</label><input type="text" id="p-name" placeholder="Введите имя">
                        <label>Дата рождения</label><input type="date" id="p-date">
                        <button class="btn btn-full" onclick="calculateLove()">Рассчитать</button>
                    </div>
                    <div id="love-result" class="ai-section" style="display:none;"></div>
                `;
            }
        }

        function calculateLove() {
            const name = document.getElementById('p-name').value;
            if(!name) return tg.showAlert("Введите имя");
            document.getElementById('love-form').style.display = 'none';
            const res = document.getElementById('love-result');
            res.style.display = 'block';
            res.innerHTML = "✨ <b>Анализ совместимости...</b>";
            setTimeout(() => {
                res.innerHTML = `<h3>Союз с партнером ${name}</h3>Ваши натальные карты имеют 85% гармонии. Основной акцент в отношениях — интеллектуальный обмен.`;
            }, 1500);
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        init();
    </script>
</body>
</html>
