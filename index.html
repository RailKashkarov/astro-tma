<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .card { background: #161b22; border-radius: 20px; padding: 30px 20px; margin: 20px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .badge { background: #7d5fff; padding: 6px 16px; border-radius: 20px; font-size: 14px; display: inline-block; font-weight: bold; }
        h1 { margin: 15px 0 5px; font-size: 28px; }
        .date { font-size: 36px; font-weight: bold; color: #ffffff; margin: 10px 0; }
        .label { color: #8b949e; font-size: 11px; margin-top: 25px; text-transform: uppercase; letter-spacing: 1.5px; }
        #hd_type { font-size: 18px; font-weight: 500; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="status_badge" class="badge">Загрузка...</div>
        <h1 id="u_name">Пользователь</h1>
        
        <p class="label">Дата рождения</p>
        <div id="b_date" class="date">??.??.????</div>
        
        <p class="label">Тип дизайна</p>
        <div id="hd_type" style="color: #7d5fff;">Напиши боту дату</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ОБЯЗАТЕЛЬНО ПРОВЕРЬ ЭТИ ДАННЫЕ
        const S_URL = "https://nimnuqzvdgxadisjtapp.supabase.co";
        const S_KEY = "sb_publishable_1vKg8mcLku8wGriVT_GeCg_fy8u84o-"; // Тот самый длинный ключ

        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        async function loadProfile() {
            const user = tg.initDataUnsafe?.user;
            if (!user) return;

            document.getElementById('u_name').innerText = user.first_name;

            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('telegram_id', user.id)
                .maybeSingle();

            if (data && data.birth_date) {
                document.getElementById('b_date').innerText = data.birth_date;
                document.getElementById('status_badge').innerText = data.zodiac_sign || "Готово";
                document.getElementById('hd_type').innerText = data.hd_type || "Генератор";
            }
        }

        loadProfile();
    </script>
</body>
</html>
