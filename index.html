<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .card { background: #161b22; border-radius: 20px; padding: 20px; margin: 20px; border: 1px solid #30363d; }
        .badge { background: #7d5fff; padding: 5px 15px; border-radius: 20px; font-size: 14px; display: inline-block; margin-bottom: 10px; }
        h1 { margin: 10px 0; font-size: 24px; }
        .date { font-size: 32px; font-weight: bold; color: #ffffff; }
        .label { color: #8b949e; font-size: 12px; margin-top: 20px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="card">
        <div id="status_badge" class="badge">Загрузка...</div>
        <h1 id="u_name">Пользователь</h1>
        
        <p class="label">Дата рождения</p>
        <div id="b_date" class="date">??.??.????</div>
        
        <p class="label">Тип дизайна</p>
        <div id="hd_type" style="color: #7d5fff;">Определяется...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // НАСТРОЙКИ SUPABASE
        const S_URL = "https://nimnuqzvdgxadisjtapp.supabase.co";
        const S_KEY = "sb_publishable_1vKg8mcLku8wGriVT_GeCg_fy8u84o-"; // ВСТАВЬ СЮДА ПУБЛИЧНЫЙ КЛЮЧ

        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        async function loadProfile() {
            const user = tg.initDataUnsafe?.user;
            if (!user) {
                document.getElementById('status_badge').innerText = "Ошибка входа";
                return;
            }

            document.getElementById('u_name').innerText = user.first_name;

            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('telegram_id', user.id)
                .maybeSingle();

            if (data && data.birth_date) {
                document.getElementById('b_date').innerText = data.birth_date;
                document.getElementById('status_badge').innerText = data.zodiac_sign || "Готово";
                document.getElementById('hd_type').innerText = data.hd_type || "Не определен";
            } else {
                document.getElementById('status_badge').innerText = "Данных нет";
                document.getElementById('hd_type').innerText = "Напиши боту дату рождения";
            }
        }

        loadProfile();
    </script>
</body>
</html>
