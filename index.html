<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro TMA Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --accent-color: #7d5fff;
            --text-main: #ffffff;
            --text-dim: #8b949e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding-top: 20px;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            border: 1px solid #30363d;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            margin-bottom: 20px;
        }

        .avatar-glow {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, var(--accent-color), #32ff7e);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(125, 95, 255, 0.3);
        }

        .user-name { font-size: 22px; font-weight: 700; margin: 0; }
        .zodiac-badge {
            display: inline-block;
            background: rgba(125, 95, 255, 0.1);
            color: var(--accent-color);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
            border: 1px solid var(--accent-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .stat-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 15px;
            text-align: left;
        }

        .stat-label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; }
        .stat-value { display: block; font-size: 16px; font-weight: 600; margin-top: 5px; }

        .action-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .action-btn:active { transform: scale(0.98); }

        #status-bar {
            position: fixed;
            bottom: 20px;
            font-size: 10px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <div class="avatar-glow" id="icon">✨</div>
            <h1 class="user-name" id="u_name">Загрузка...</h1>
            <div class="zodiac-badge" id="z_name">Синхронизация...</div>

            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Дата рождения</span>
                    <span class="stat-value" id="b_date">??.??.????</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Энергия дня</span>
                    <span class="stat-value" style="color: #32ff7e;">98%</span>
                </div>
            </div>
        </div>

        <button class="action-btn" onclick="openBodygraph()">Открыть Бодиграф</button>
        <button class="action-btn" style="background: #21262d;" onclick="tg.close()">Закрыть</button>
    </div>

    <div id="status-bar">Система готова</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // ТВОИ ДАННЫЕ (уже вставлены из твоего кода)
        const S_URL = "https://nimnuqzvdgxadisjtapp.supabase.co";
        const S_KEY = "sb_secret_j0YFSU5y0AKh6EDdAtuF9A_SOC77tT7"; 

        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        async function loadData() {
            const user = tg.initDataUnsafe?.user || { id: 512214421, first_name: "Странник" }; // Тестовый ID если открыто не в TG
            document.getElementById('u_name').innerText = user.first_name;

            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('telegram_id', user.id)
                .maybeSingle();

            if (data) {
                document.getElementById('z_name').innerText = data.zodiac_sign || "Знак не определен";
                document.getElementById('b_date').innerText = data.birth_date || "Не указана";
                document.getElementById('status-bar').innerText = "Данные из звездной базы получены";
                
                // Меняем иконку в зависимости от знака (просто для красоты)
                if(data.zodiac_sign) document.getElementById('icon').innerText = "🌙";
            } else {
                document.getElementById('status-bar').innerText = "Профиль не найден. Напишите дату боту.";
            }
        }

        function openBodygraph() {
            tg.showAlert("Расчет Бодиграфа будет доступен в следующем обновлении!");
        }

        loadData();
    </script>
</body>
</html>
