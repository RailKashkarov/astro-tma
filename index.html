<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; text-align: center; padding-top: 30px; }
        .card { background: #161b22; border-radius: 20px; padding: 25px; margin: 15px; border: 1px solid #30363d; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .badge { background: #7d5fff; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .data-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #21262d; }
        .data-label { color: #8b949e; font-size: 13px; }
        .data-value { font-weight: bold; color: #ffffff; }
        h1 { font-size: 22px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="status_badge" class="badge">Данные загружаются...</div>
        <h1 id="u_name">Пользователь</h1>
        
        <div class="data-row">
            <span class="data-label">Дата:</span>
            <span id="b_date" class="data-value">--.--.----</span>
        </div>
        <div class="data-row">
            <span class="data-label">Время:</span>
            <span id="b_time" class="data-value">--:--</span>
        </div>
        <div class="data-row">
            <span class="data-label">Город:</span>
            <span id="b_city" class="data-value">Не указан</span>
        </div>
        <div class="data-row">
            <span class="data-label">Знак:</span>
            <span id="z_sign" class="data-value" style="color: #7d5fff;">...</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const S_URL = "https://nimnuqzvdgxadisjtapp.supabase.co";
        const S_KEY = "sb_publishable_1vKg8mcLku8wGriVT_GeCg_fy8u84o-"; // Вставь сюда свой ключ

        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        async function loadProfile() {
            const user = tg.initDataUnsafe?.user;
            if (!user) return;
            document.getElementById('u_name').innerText = user.first_name;

            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('telegram_id', user.id)
                .maybeSingle();

            if (data) {
                document.getElementById('b_date').innerText = data.birth_date || "--.--.----";
                document.getElementById('b_time').innerText = data.birth_time || "12:00";
                document.getElementById('b_city').innerText = data.birth_city || "Не указан";
                document.getElementById('z_sign').innerText = data.zodiac_sign || "Рассчитано";
                document.getElementById('status_badge').innerText = "Профиль активен";
            } else {
                document.getElementById('status_badge').innerText = "Данных нет";
            }
        }
        loadProfile();
    </script>
</body>
</html>
