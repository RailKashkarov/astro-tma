<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro TMA - Personal Universe</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --accent: #8a2be2;
        }
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }
        /* Звездный фон */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3;
        }
        .container {
            padding: 20px;
            text-align: center;
        }
        .profile-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        h1 { font-weight: 300; letter-spacing: 2px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
        }
        .menu-item {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px 10px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .menu-item:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }
        .icon { font-size: 24px; }
        .ai-badge {
            font-size: 10px;
            background: var(--accent);
            padding: 2px 6px;
            border-radius: 10px;
            margin-top: 5px;
        }
        /* Окно загрузки */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #090a0f;
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="loader">🌀 Загрузка звезд...</div>
    <div class="stars"></div>

    <div class="container">
        <h1>ASTRO SYSTEM</h1>
        
        <div class="profile-card" id="profile">
            <div id="user-name">Загрузка...</div>
            <div style="font-size: 12px; opacity: 0.7;" id="user-info">Соединение с базой...</div>
        </div>

        <div class="grid">
            <div class="menu-item" onclick="openModule('natal')">
                <span class="icon">🪐</span>
                <span>Натал</span>
                <span class="ai-badge">AI Ready</span>
            </div>
            <div class="menu-item" onclick="openModule('hd')">
                <span class="icon">🧬</span>
                <span>Human Design</span>
                <span class="ai-badge">AI Ready</span>
            </div>
            <div class="menu-item" onclick="openModule('finance')">
                <span class="icon">💎</span>
                <span>Финансы</span>
                <span class="ai-badge">AI Ready</span>
            </div>
            <div class="menu-item" onclick="openModule('horo')">
                <span class="icon">🔮</span>
                <span>Прогноз</span>
                <span class="ai-badge">AI Ready</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
