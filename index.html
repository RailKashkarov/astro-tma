<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
        h1 { color: #e0e0e0; font-size: 24px; margin-bottom: 10px; }
        .zodiac-icon { font-size: 60px; margin: 20px 0; }
        button {
            background: linear-gradient(45deg, #6a11cb 0%, #2575fc 100%);
            border: none;
            padding: 12px 25px;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Astro App</h1>
        <div id="user-name">Загрузка...</div>
        <div class="zodiac-icon" id="icon">✨</div>
        <div id="zodiac-sign">Твой знак зодиака</div>
        <button onclick="Telegram.WebApp.close()">Вернуться в чат</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на всё окно

        // Берем имя пользователя из данных Телеграма
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = `Привет, ${user.first_name}!`;
        }
    </script>
</body>
</html>
