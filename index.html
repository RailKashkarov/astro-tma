<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Все стили из предыдущего сообщения оставляем без изменений */
        :root { --glass: rgba(255, 255, 255, 0.1); --accent: #8a2be2; }
        body { margin: 0; background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); color: white; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #090a0f; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--glass); border-top: 4px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .content { display: none; text-align: center; width: 100%; padding: 20px; box-sizing: border-box; }
        .profile-card { background: var(--glass); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-item { background: var(--glass); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div>Загрузка звезд...</div>
    </div>

    <div id="app-content" class="content">
        <h1>ASTRO SYSTEM</h1>
        <div class="profile-card">
            <h2 id="user-name">Имя пользователя</h2>
            <p id="user-info" style="opacity: 0.6;">Данные загружаются...</p>
        </div>
        <div class="grid">
            <div class="menu-item" onclick="openModule('natal')">🪐 Натал</div>
            <div class="menu-item" onclick="openModule('hd')">🧬 Дизайн</div>
            <div class="menu-item" onclick="openModule('finance')">💎 Финансы</div>
            <div class="menu-item" onclick="openModule('horo')">🔮 Прогноз</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
