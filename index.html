<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0b0e14; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .card { background: #161b22; border-radius: 20px; padding: 30px 20px; margin: 20px; border: 1px solid #30363d; }
        .badge { background: #7d5fff; padding: 6px 16px; border-radius: 20px; font-size: 14px; display: inline-block; }
        .date { font-size: 36px; font-weight: bold; margin: 10px 0; }
        .label { color: #8b949e; font-size: 11px; margin-top: 20px; text-transform: uppercase; }
        #error_log { color: #ff4d4d; font-size: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="status_badge" class="badge">Загрузка...</div>
        <h1 id="u_name">Пользователь</h1>
        <p class="label">Дата рождения</p>
        <div id="b_date" class="date">??.??.????</div>
        <p class="label">Знак зодиака</p>
        <div id="z_sign" style="color: #7d5fff;">Синхронизация...</div>
        <div id="error_log"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const S_URL = "https://nimnuqzvdgxadisjtapp.supabase.co";
        const S_KEY = "sb_publishable_1vKg8mcLku8wGriVT_GeCg_fy8u84o-"; // Вставь ключ из Settings -> API -> anon public

        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        async function loadProfile() {
            const user = tg.initDataUnsafe?.user;
            if (!user) {
                document.getElementById('error_log').innerText = "Запустите через Telegram";
                return;
            }
            document.getElementById('u_name').innerText = user.first_name;

            // Запрос к базе
            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('telegram_id', user.id)
                .maybeSingle();

            if (error) {
                document.getElementById('error_log').innerText = "Ошибка базы: " + error.message;
                return;
            }

            if (data) {
                document.getElementById('b_date').innerText = data.birth_date || "??.??.????";
                document.getElementById('z_sign').innerText = data.zodiac_sign || "Не определен";
                document.getElementById('status_badge').innerText = "Данные получены";
            } else {
                document.getElementById('status_badge').innerText = "Данных нет";
                document.getElementById('z_sign').innerText = "Напишите боту дату";
            }
        }
        loadProfile();
    </script>
</body>
</html>
